<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Smart School: one platform to run every branch of your school">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F4438"/>
      <stop offset="1" stop-color="#11271F"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9713A"/>
      <stop offset="1" stop-color="#7A4E24"/>
    </linearGradient>
    <radialGradient id="smudge" cx="0.3" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <style>
      .underline { stroke-dasharray: 600; }
      @media (prefers-reduced-motion: no-preference) {
        .underline { animation: draw 1.6s ease-out both; }
      }
      @keyframes draw { from { stroke-dashoffset: 600; } to { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <rect width="1280" height="440" rx="22" fill="url(#wood)"/>
  <rect x="16" y="16" width="1248" height="390" rx="10" fill="url(#board)"/>
  <rect x="16" y="16" width="1248" height="390" rx="10" fill="url(#smudge)"/>

  <!-- Chalk ledge -->
  <rect x="0" y="406" width="1280" height="34" fill="#6A421D"/>
  <rect x="960" y="396" width="86" height="12" rx="6" fill="#F4F1E6"/>
  <rect x="1060" y="398" width="60" height="10" rx="5" fill="#F5C542"/>

  <!-- Chalk doodles -->
  <g fill="none" stroke="#F4F1E6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.28">
    <path d="M880 110l100 0 0 76z"/>
    <path d="M966 186v-14h14"/>
    <circle cx="1130" cy="110" r="10"/>
    <ellipse cx="1130" cy="110" rx="58" ry="22"/>
    <ellipse cx="1130" cy="110" rx="58" ry="22" transform="rotate(60 1130 110)"/>
    <ellipse cx="1130" cy="110" rx="58" ry="22" transform="rotate(120 1130 110)"/>
    <path d="M870 300l44-96 44 96M886 266h56"/>
    <path d="M1010 250h160v44h-160zM1040 250v16M1070 250v24M1100 250v16M1130 250v24"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#F4F1E6" opacity="0.32">
    <text x="880" y="82" font-size="30">a² + b² = c²</text>
    <text x="1010" y="350" font-size="26">E = mc²</text>
  </g>

  <!-- Graduation cap -->
  <g transform="translate(84 92)" fill="none" stroke="#F5C542" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 8L120 36 60 64 0 36z" fill="#F5C542" fill-opacity="0.16"/>
    <path d="M24 48v28c0 9 16 18 36 18s36-9 36-18V48"/>
    <path d="M120 36v38"/>
    <circle cx="120" cy="82" r="5" fill="#F5C542"/>
  </g>

  <!-- Title -->
  <text x="240" y="166" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="700" fill="#F7F4E9">Smart School</text>
  <path class="underline" d="M244 190c120-9 340-11 586-3" fill="none" stroke="#F5C542" stroke-width="6" stroke-linecap="round"/>

  <text x="84" y="264" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" fill="#F7F4E9">One platform to run every branch of your school.</text>
  <text x="84" y="316" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#F7F4E9" opacity="0.72">Academics  ·  Exams  ·  Attendance  ·  Finance  ·  Library  ·  Transport</text>
</svg>
